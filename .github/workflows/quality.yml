name: CivicConnect quality gates

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile Python source
        run: |
          if [ -d product ]; then
            python -m compileall -q product
          else
            echo "No product directory yet - skipping compile check"
          fi

      - name: Run automated tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No tests directory yet - skipping test run"
          fi

      - name: Static security analysis
        run: |
          pip install bandit
          if [ -d product ]; then
            bandit -r product -ll
          else
            echo "No product directory yet - skipping security scan"
          fi

      - name: Check for hardcoded secrets
        run: |
          if grep -rn "password[[:space:]]*=[[:space:]]*['\"]" --include="*.py" --include="*.sql" . 2>/dev/null | grep -v "example\|dummy\|placeholder\|test\|None"; then
            echo "Potential hardcoded secrets detected. Review output above."
            exit 1
          else
            echo "No hardcoded secrets detected."
          fi

      - name: Verify configuration documentation
        run: |
          if [ ! -f .env.example ]; then
            echo "WARNING: .env.example is missing. Configuration should be documented."
          else
            echo ".env.example found. Configuration is documented."
          fi
